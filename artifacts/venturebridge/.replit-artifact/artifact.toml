kind = "web"
previewPath = "/"
title = "VentureBridge"
description = "A student startup funding platform prototype connecting student founders, program administrators, and investors. Includes role-based demo dashboards, funding applications, review and budgeting, and investor interest with local browser persistence."
version = "1.0.0"
id = "artifacts/venturebridge"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25626

[services.development]
run = "pnpm --filter @workspace/venturebridge run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/venturebridge", "run", "build" ]
serve = "static"
publicDir = "artifacts/venturebridge/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25626"
BASE_PATH = "/"
